name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Show CPU
        run: |
          grep -m1 "model name" /proc/cpuinfo
          grep -m1 -o -E "avx_vnni|avx512_vnni" /proc/cpuinfo || echo "no VNNI"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,deploy]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  # Phase 4: add a job that builds cpp/ with CMake and runs the GoogleTest suite.
  # Phase 5: add a job that deploys web/ to GitHub Pages on pushes to main.
