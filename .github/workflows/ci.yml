name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Show CPU
        run: |
          grep -m1 "model name" /proc/cpuinfo
          grep -m1 -o -E "avx_vnni|avx512_vnni" /proc/cpuinfo || echo "no VNNI"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,deploy]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  # Checks correctness only: latency numbers from a shared runner would mean nothing.
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show system
        run: |
          grep -m1 "model name" /proc/cpuinfo
          grep -m1 -o -E "avx_vnni|avx512_vnni" /proc/cpuinfo || echo "no VNNI"
          lsb_release -ds
          g++ --version | head -1
          cmake --version | head -1
      - name: Build
        run: |
          cmake -S cpp -B build/cpp
          cmake --build build/cpp --parallel
      - name: Test
        run: ctest --test-dir build/cpp --output-on-failure
      # The runners change from job to job, some have VNNI and some do not. 8-bit weights gave other
      # results without it, so this case must not depend on which runner we get.
      - name: Test on an emulated CPU without VNNI
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          qemu-x86_64 -cpu Haswell build/cpp/test_cnn_correction

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Test
        run: node --test "web/tests/*.test.mjs"

  # Publishes the browser demo, only from main and only when all tests pass. It needs
  # Settings > Pages > Source set to "GitHub Actions" in the repository.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, cpp, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect the files of the page
        run: |
          mkdir site
          cp -r web/index.html web/style.css web/js web/model site/
      # One name per attempt: a re-run keeps the files of the earlier attempts, and with the same
      # name deploy-pages stops because it finds several artifacts.
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
