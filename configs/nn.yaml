# Neural estimator: data, model and training.
# OFDM, pilot and channel settings come from default.yaml.

name: A                       # models/cnn_<name>.pt and results/training_<name>.*
seed: 0                       # weight init and batch shuffling

data:
  region: A
  snr_db: [0.0, 30.0]         # each slot draws its SNR uniformly from this range
  train: {n_slots: 32000, seed: 100}
  val: {n_slots: 4000, seed: 101}
  # Independent test data for the evaluation, never used for training or model selection.
  test_slots: 4000            # slots per SNR point
  test_seeds: {A: 102, B: 103}

model:
  channels: 16
  layers: 4
  kernel_size: 3
  use_snr: true

training:
  loss: mse                   # mse | log_nmse
  batch_size: 128
  lr: 1.0e-3
  max_epochs: 100
  patience: 10                # stop after this many epochs without a better val loss

# Where does the network break? NMSE on a grid of fixed channel conditions.
failure_map:
  delay_spread_us: [0.1, 0.3, 0.5, 0.7, 0.9, 1.1, 1.3, 1.5]
  doppler_hz: [0, 100, 200, 300, 400, 500, 600, 700, 800]
  snr_db: [10, 20, 30]
  n_slots: 300                # per cell and SNR
  seed: 104
